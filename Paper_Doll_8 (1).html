<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Paper Doll 2.5D</title>
<style>
:root{--ui:rgba(35,50,30,.78);--txt:#fff;--bg:#a8dcf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ui:rgba(12,20,12,.82);--bg:#8cc4e0}}
:root[data-theme="dark"]{--ui:rgba(12,20,12,.82);--bg:#8cc4e0}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:"Trebuchet MS",Verdana,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#tut{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);max-width:min(46%,300px);box-sizing:border-box;
 background:var(--ui);color:var(--txt);text-align:center;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:bold;line-height:1.25;
 white-space:pre-line;pointer-events:none;border:2px solid #fff;transition:opacity .5s}
#cz{position:fixed;inset:0;z-index:5}
#jz{position:fixed;left:0;bottom:0;width:50%;height:60%;z-index:10}
#jb{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.6);display:none;transform:translate(-50%,-50%);pointer-events:none;z-index:11}
#jk{position:absolute;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.9);left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#btns{position:fixed;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:18px;align-items:flex-end;z-index:10}
.b{width:82px;height:82px;border-radius:50%;border:4px solid #fff;color:#fff;font-size:30px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#A{background:#34b86a}#B{background:#e8543f;margin-bottom:34px}
#skip{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 26px);z-index:20;background:var(--ui);color:var(--txt);border:3px solid #fff;border-radius:999px;padding:10px 22px;font-weight:bold;font-size:16px}
.cine #skip{display:block}.cine #btns,.cine #jz,.cine #cnt,.cine #skBtn{display:none}
#cnt{position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 14px);background:var(--ui);color:var(--txt);border:3px solid #fff;border-radius:999px;padding:6px 12px;font-weight:bold;font-size:15px;pointer-events:none;z-index:12}
#stam{display:none;position:fixed;left:calc(env(safe-area-inset-left,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 58px);width:130px;height:14px;border-radius:9px;background:var(--ui);border:3px solid #fff;z-index:12;overflow:hidden;pointer-events:none}
#stam i{display:block;height:100%;width:100%;background:#7fe3ff}
.cine #stam{display:none!important}
#skBtn{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);top:calc(env(safe-area-inset-top,0px) + 14px);z-index:12;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--ui);font-size:20px;padding:0}
#shop{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);align-items:center;justify-content:center}
#shop.on{display:flex}
button{font-family:inherit;color:#fff}
#shbox{background:var(--ui);border:3px solid #fff;border-radius:20px;padding:12px;width:min(92vw,460px);max-height:88vh;display:flex;flex-direction:column;gap:10px;color:var(--txt);box-sizing:border-box}
#shtop{display:flex;align-items:center;gap:12px}
#shprev{width:92px;height:92px;background:rgba(255,255,255,.18);border-radius:16px;flex:none}
#shtt{flex:1;display:flex;flex-direction:column;gap:4px;font-size:19px;font-weight:bold}
#shcoins{font-size:16px}
#shx{width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:rgba(255,255,255,.15);font-size:18px;padding:0;flex:none}
#shtabs{display:flex;gap:6px}
.tb{flex:1;height:44px;border-radius:12px;border:3px solid #fff;background:rgba(255,255,255,.12);font-size:20px;padding:0}
.tb.on{background:#34b86a}
#shgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow-y:auto;touch-action:pan-y;min-height:140px;padding:3px}
.it{border:3px solid #fff;border-radius:14px;background:rgba(255,255,255,.12);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:bold;text-align:center;color:#fff}
.it canvas{width:64px;height:64px}
.it.eq{outline:4px solid #ffd23f}
.it.no{opacity:.6}
.it .pr{font-size:13px}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .45s;z-index:40}
#net{display:none;position:fixed;inset:0;z-index:31;background:rgba(0,0,0,.55);align-items:center;justify-content:center}
#net.on{display:flex}
#nbox,#mbox{background:var(--ui);border:3px solid #fff;border-radius:20px;padding:16px;width:min(88vw,380px);display:flex;flex-direction:column;gap:12px;color:var(--txt);box-sizing:border-box;text-align:center;font-weight:bold}
.nb{height:52px;border-radius:14px;border:3px solid #fff;font-size:19px;font-weight:bold;background:#34b86a;color:#fff}
.nb.alt{background:#4a86e8}.nb.out{background:#e8543f}.nb.gr{background:rgba(255,255,255,.15)}
#ncode{height:52px;border-radius:14px;border:3px solid #fff;font-size:28px;text-align:center;letter-spacing:10px;background:rgba(255,255,255,.15);color:#fff;font-weight:bold;user-select:text;-webkit-user-select:text;width:100%;box-sizing:border-box}
#nst{font-size:15px;min-height:20px;line-height:1.3}
#menu{display:none;position:fixed;inset:0;z-index:32;background:rgba(0,0,0,.55);align-items:center;justify-content:center}
#menu.on{display:flex}
#mbox{gap:9px;max-height:92vh;overflow-y:auto}
#mst{font-size:15px;min-height:20px;line-height:1.35;white-space:pre-line}

/* ===== Carregamento + saves ===== */
#boot,#slots{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);transition:opacity .5s}
#boot.off,#slots.off{opacity:0;pointer-events:none}
#slots{display:none;z-index:59;justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 18px;box-sizing:border-box;gap:10px}
#slots.on{display:flex}
#boot h1{margin:0 0 6px;font-size:clamp(34px,9vw,60px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.18);letter-spacing:1px}
#bdoll{width:64px;height:84px;background:#fff6e0;border:3px solid #e3d6b6;border-radius:10px 10px 6px 6px;position:relative;margin-bottom:12px;box-shadow:0 5px 0 rgba(0,0,0,.15);animation:bwob 1.1s ease-in-out infinite;transform-origin:50% 100%}
#bdoll:before{content:"";position:absolute;left:50%;top:10px;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:#ffd9b8;border:3px solid #e3d6b6;box-sizing:border-box}
#bdoll:after{content:"• •";position:absolute;left:0;right:0;top:20px;text-align:center;font-size:11px;color:#2a1a12;letter-spacing:6px;line-height:10px}
@keyframes bwob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) translateY(-6px)}}
#bbar{width:min(66vw,320px);height:20px;border-radius:12px;background:rgba(255,255,255,.4);border:3px solid #fff;overflow:hidden;box-sizing:border-box}
#bbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,#fff 0 10px,#fff6e0 10px 20px);transition:width .25s}
#btxt{margin-top:10px;font-size:16px;font-weight:bold;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);text-align:center;min-height:22px}
#sltt{font-size:clamp(22px,5vw,30px);font-weight:bold;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);flex:none}
#slrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center;flex:1;width:100%}
.card{position:relative;width:min(29vw,230px);min-width:190px;height:min(62vh,320px);min-height:230px;cursor:pointer;perspective:900px;flex:none}
.card:nth-child(1){transform:rotate(-2deg)}.card:nth-child(3){transform:rotate(2deg)}
.sheet{position:absolute;inset:0;background:#fff;border-radius:6px;box-shadow:0 8px 0 rgba(0,0,0,.14),0 14px 22px rgba(0,0,0,.18);padding:12px 12px 10px;box-sizing:border-box;overflow:hidden;
 background-image:repeating-linear-gradient(transparent 0 25px,rgba(90,140,210,.22) 25px 26px);background-position:0 44px;transition:transform .15s}
.card:active .sheet{transform:translateY(3px)}
.sheet:before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:rgba(224,72,59,.35)}
.sn{position:relative;font-size:22px;font-weight:bold;color:#2a1a12;margin-bottom:4px}
.sm{position:relative;font-size:13px;color:#7a6a58;line-height:1.3}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9a8a78;font-size:15px;font-weight:bold;text-align:center;padding:0 16px}
.empty b{font-size:34px}
.stamps{position:relative;display:flex;flex-wrap:wrap;gap:8px 6px;margin-top:6px;justify-content:center}
.stp{--c:#d9453b;border:3px double var(--c);color:var(--c);border-radius:8px;padding:3px 7px;font-size:12px;font-weight:bold;text-align:center;line-height:1.15;background:rgba(255,255,255,.55);opacity:.88;text-transform:uppercase;letter-spacing:.5px;animation:slam .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0s)}
.stp b{display:block;font-size:15px}
.stp.full{border:3px solid #c88a00;color:#a56d00;background:#ffe9a0;box-shadow:0 0 0 2px #ffd23f inset}
@keyframes slam{0%{transform:scale(2.6) rotate(var(--r));opacity:0}100%{transform:scale(1) rotate(var(--r));opacity:.88}}
.coinl{position:relative;margin-top:8px;text-align:center;font-weight:bold;color:#2a1a12;font-size:14px}
.del{position:absolute;right:6px;top:6px;z-index:3;border:2px solid #e8543f;background:#fff;color:#e8543f;border-radius:10px;font-size:11px;font-weight:bold;padding:3px 6px}
.book{position:absolute;inset:0;border-radius:4px 12px 12px 4px;background:linear-gradient(135deg,#8c3b2e,#b4513f);box-shadow:0 8px 0 rgba(0,0,0,.2),0 14px 22px rgba(0,0,0,.25);border-left:14px solid #5e2419;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#ffe9a0;transform-origin:left center;transition:transform .7s ease-in}
.book:before{content:"";position:absolute;inset:10px;border:2px solid rgba(255,233,160,.7);border-radius:3px}
.book .bt{font-size:22px;font-weight:bold;text-align:center;line-height:1.1;position:relative}
.book .bn{font-size:13px;position:relative;opacity:.85}
.fin{position:relative;border:4px double #ffd23f;color:#ffd23f;border-radius:10px;padding:6px 14px;font-size:28px;font-weight:bold;letter-spacing:3px;transform:rotate(-8deg);animation:slam .5s cubic-bezier(.3,1.6,.5,1) both .2s;--r:-8deg}
.card .pages{position:absolute;inset:4px 2px 4px 14px;background:#fff6e0;border-radius:3px;display:none;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.card.opening .pages{display:block}
.card.opening .book{transform:rotateY(-150deg)}
#mbox,#kbox{touch-action:pan-y}
#kbp{display:none;position:fixed;inset:0;z-index:34;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
#kbp.on{display:flex}
#kbox{background:var(--ui);border:3px solid #fff;border-radius:20px;padding:16px;width:min(92vw,420px);max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:9px;color:var(--txt);box-sizing:border-box;font-weight:bold}
#kbmsg{font-size:13px;line-height:1.35;min-height:34px;text-align:center}
.kr{display:flex;align-items:center;gap:8px}
.kr span{flex:1;font-size:15px}
.kk{min-width:88px;height:40px;border-radius:12px;border:3px solid #fff;background:rgba(255,255,255,.15);font-size:15px;font-weight:bold;color:#fff;padding:0 6px}
.kk.on{background:#e8a33a}
</style>
</head>
<body>

<div id="boot"><div id="bdoll"></div><h1>Paper Doll</h1><div id="bbar"><i></i></div><div id="btxt">Dobrando os papéis…</div></div>
<div id="slots"><div id="sltt">📖 Escolha seu save</div><div id="slrow"></div></div>
<div id="tut"></div>
<div id="cz"></div><div id="jz"></div><div id="jb"><div id="jk"></div></div>
<div id="skip">Pular ▶</div>
<div id="cnt">📄 0/7 · 🪙 0</div><div id="stam"><i></i></div><button id="skBtn">☰</button>
<div id="shop"><div id="shbox"><div id="shtop"><canvas id="shprev" width="184" height="184"></canvas><div id="shtt"><span id="shtitle">Loja</span><span id="shcoins"></span></div><button id="shx">✕</button></div><div id="shtabs"></div><div id="shgrid"></div></div></div><div id="fade"></div>
<div id="net"><div id="nbox"><div style="font-size:22px">🌐 Jogo Online</div><div id="nst">Jogue com amigos usando um código de 4 dígitos.</div>
<button class="nb" id="nhost">Hospedar sala</button><div id="nor" style="font-size:14px">ou entre numa sala:</div>
<input id="ncode" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off"><button class="nb alt" id="njoin">Entrar</button>
<button class="nb out" id="nleave" style="display:none">Sair da sala</button><button class="nb gr" id="nclose">Fechar</button></div></div>
<div id="menu"><div id="mbox"><div style="font-size:22px">☰ Menu</div><div id="mst"></div>
<button class="nb" id="mres">▶ Continuar</button><button class="nb alt" id="mwar">👕 Guarda-roupa</button><button class="nb alt" id="mtro">🏆 Troféus</button><button class="nb alt" id="mkey">⌨️ Controles do PC</button><button class="nb alt" id="monl">🌐 Jogar online</button><button class="nb gr" id="mlob">🏠 Voltar ao lobby</button><button class="nb alt" id="mslot">📖 Trocar de save</button><button class="nb out" id="mrst">🗑️ Apagar progresso</button></div></div>
<div id="kbp"><div id="kbox"><div style="font-size:22px;text-align:center">⌨️ Controles do PC</div><div id="kbmsg"></div><div id="kbrows"></div><button class="nb gr" id="kbrst">↩ Restaurar padrão</button><button class="nb" id="kbok">✔ Pronto</button></div></div>
<div id="btns"><div class="b" id="B">B</div><div class="b" id="A">A</div></div>
<script type="text/plain" id="gamecode">
const V = THREE, $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 })(7);

// ================= CENA =================
const SKY = 0xa8dcf5;
const scene = new V.Scene();
scene.background = new V.Color(SKY);
scene.fog = new V.Fog(SKY, 30, 78);
const cam = new V.PerspectiveCamera(38, 1, .1, 150);
const R = new V.WebGLRenderer({ antialias: true });
R.setPixelRatio(Math.min(devicePixelRatio, 2));
R.shadowMap.enabled = true; R.shadowMap.type = V.PCFSoftShadowMap;
document.body.appendChild(R.domElement);

scene.add(new V.HemisphereLight(0xdff3ff, 0x7a9a45, .9));
const sun = new V.DirectionalLight(0xfff0cf, .95);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -.0006;
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, far: 90 });
scene.add(sun, sun.target);

const mats = {};
const mat = c => mats[c] || (mats[c] = new V.MeshLambertMaterial({ color: c, flatShading: true }));
function mesh(geo, c, x = 0, y = 0, z = 0) {
  const m = new V.Mesh(geo, mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; return m;
}

// Chão com variação de cor (vertex colors)
{
  const g = new V.PlaneGeometry(150, 260, 75, 130); g.rotateX(-Math.PI / 2);
  const col = [], a = new V.Color(0x62c447), b = new V.Color(0x9ae05a), c = new V.Color();
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const n = (Math.sin(p.getX(i) * .13) + Math.cos(p.getZ(i) * .11) + Math.sin((p.getX(i) + p.getZ(i)) * .27)) / 6 + .5;
    c.copy(a).lerp(b, clamp(n + (rnd() - .5) * .25, 0, 1)); col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new V.Float32BufferAttribute(col, 3));
  const ground = new V.Mesh(g, new V.MeshLambertMaterial({ vertexColors: true }));
  ground.receiveShadow = true; ground.position.set(0, 0, -55); scene.add(ground);
  // caminho de terra (largura toda do corredor) + borda mais escura onde ficam as paredes invisíveis
  const dirt = (w, d, col, x, z, y) => { const m = new V.Mesh(new V.PlaneGeometry(w, d).rotateX(-Math.PI / 2), mat(col)); m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m; };
  dirt(9.4, 140, 0xbf955f, 0, -42.5, .03);
  dirt(2.6, 140, 0xcda573, 0, -42.5, .035);
  [-1, 1].forEach(sd => dirt(1.2, 140, 0x9a6f42, sd * 4.1, -42.5, .036));
  for (let i = 0; i < 90; i++) { // pedrinhas e torrões na terra
    const sd = rnd() > .5 ? 1 : -1, px = sd * (3.4 + rnd() * 1.4), pz = 26 - rnd() * 138, pb = mesh(new V.DodecahedronGeometry(.1 + rnd() * .14, 0), rnd() > .5 ? 0x8d7a66 : 0xa8855a, px, .07, pz);
    pb.rotation.set(rnd() * 3, rnd() * 3, 0); pb.castShadow = false; scene.add(pb);
  }
}

const cols = []; // colisões circulares
function tree(x, z, s = 1) {
  const g = new V.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
  g.add(mesh(new V.CylinderGeometry(.25, .36, 1.7, 6), 0x8a5a33, 0, .85, 0));
  [[1.45, 2.3, 0x3fa34d], [1.15, 3.2, 0x4cbb5a], [.8, 4, 0x6fd06a]].forEach(([r, y, c]) => {
    const l = mesh(new V.IcosahedronGeometry(r, 0), c, 0, y, 0); l.rotation.y = rnd() * 6; g.add(l);
  });
  scene.add(g); cols.push({ x, z, r: .55 * s });
}
function palm(x, z, sc = 1) {
  const g = new V.Group(); g.position.set(x, 0, z); g.scale.setScalar(sc);
  const t = mesh(new V.CylinderGeometry(.2, .32, 3.4, 6), 0xb8874a, 0, 1.7, 0); t.rotation.z = .12; g.add(t);
  for (let i = 0; i < 5; i++) { const a = i * 1.257, l = mesh(new V.ConeGeometry(.55, 2.4, 4), 0x3fb05a, Math.cos(a) * 1.1, 3.5, Math.sin(a) * 1.1); l.rotation.set(Math.sin(a) * 1.2, 0, -Math.cos(a) * 1.2); g.add(l); }
  scene.add(g); cols.push({ x, z, r: .5 * sc });
}
function house(x, z) {
  const g = new V.Group(); g.position.set(x, 0, z);
  g.add(mesh(new V.BoxGeometry(4, 3, 4), 0xfff0d0, 0, 1.5, 0));
  const roof = mesh(new V.ConeGeometry(3.6, 2.4, 4), 0xd9534f, 0, 4.2, 0); roof.rotation.y = Math.PI / 4; g.add(roof);
  g.add(mesh(new V.BoxGeometry(.9, 1.7, .15), 0x7a4a2a, 0, .85, 2.02));
  g.add(mesh(new V.BoxGeometry(.9, .9, .15), 0x9fd8f5, -1.9 + .01, 1.8, 1.2).rotateY(Math.PI / 2));
  g.add(mesh(new V.BoxGeometry(.7, 1.6, .7), 0xb8704a, 1.1, 4.6, -.8));
  scene.add(g); cols.push({ x, z, r: 2.7 });
}
house(-24, -18); house(24, -18); house(-12, -6);

// ===== Caminho de treino: troncos, lago e rocha =====
const boxes = []; // obstáculos com altura (centro x/z, meia-largura hx/hz, altura h)
const box = (x, z, hx, hz, h) => { const b = { x, z, hx, hz, h, dead: false }; boxes.push(b); return b; };
const LANE = 3.6, cpt = { x: 0, z: 24 };
let portalT = 0;
[-1, 1].forEach(sd => { // cercas-vivas dos dois lados
  box(sd * (LANE + .5), 7, .5, 20, 2.2); /* parede invisível */
});
box(0, 27.5, LANE + 1, .5, 2.2); /* parede invisível */
[17, 12].forEach(z => { // troncos: pule com A

    if (cine && cine.kind === 'shadow') { const caps = SHCAP; let ci = 0; caps.forEach((c, i) => { if (t >= c[0]) ci = i; }); if (ci !== cine.ci) { cine.ci = ci; tut.style.opacity = caps[ci][1] ? 1 : 0; tut.textContent = caps[ci][1]; } }
  }
  const baseY = P.climb || P.y - gy > 2.5 ? P.y : gy; camY += (baseY - camY) * (1 - Math.exp(-8 * dt)); // câmera acompanha a altura de verdade
  const hy = camY + (P.y - baseY) * .5;
  let want = new V.Vector3(P.x + Math.sin(yaw) * Math.cos(pit) * dist, Math.max(hy + Math.sin(pit) * dist, 1.5), P.z + Math.cos(yaw) * Math.cos(pit) * dist);
  let ft = new V.Vector3(P.x, 1.3 + hy, P.z), kc = 6, kf = 10;
  if (cine) { const sh = cineShot(cine.t); want = sh.cam; ft = sh.look; kc = kf = 2.6; if (sh.n !== undefined && sh.n !== cine.sn) { if (sh.cut) { cp.copy(want); focus.copy(ft); } cine.sn = sh.n; } }
  cp.lerp(want, 1 - Math.exp(-kc * dt));
  focus.lerp(ft, 1 - Math.exp(-kf * dt));
  gates.forEach((o, k) => { o.s += (o.t - o.s) * (1 - Math.exp(-8 * dt)); o.g.scale.setScalar(o.s); o.disc.position.y = 1.9 + Math.sin(time * 2 + k) * .1; o.disc.material.opacity = (k === 0 || (k < 3 && savedIn(k) >= 7)) ? .85 : .3; });
  badges.forEach(b => b.rotation.y = yaw);
  arrow.rotation.y = time * 2; arrow.position.y = 9.2 + Math.abs(Math.sin(time * 3)) * .7;
  shake = Math.max(0, shake - dt * 1.2);
  cam.position.copy(cp).add(new V.Vector3((rnd() - .5) * shake, (rnd() - .5) * shake, 0));
  cam.lookAt(focus);
  const fov = 38 + (P.dash > 0 ? 6 : 0); cam.fov += (fov - cam.fov) * (1 - Math.exp(-10 * dt)); cam.updateProjectionMatrix();
  sun.position.set(focus.x + 14, 28, focus.z + 9); sun.target.position.copy(focus);

  levelTick(dt, time); bossTick(dt, time); netTick(time, dt);
  // poeira + nuvens
  for (const d of dust) if (d.life > 0) { d.life -= dt; d.m.position.x += d.vx * dt; d.m.position.z += d.vz * dt; d.m.position.y += dt; d.m.scale.setScalar(Math.max(d.life * 2, .01)); d.m.material.opacity = d.life * 1.6; if (d.life <= 0) d.m.visible = false; }
  clouds.forEach((g, i) => { g.position.x += dt * (.6 + i * .05); if (g.position.x > 80) g.position.x = -80; });

  tutTick();
  if (inHub && !lv.on && !cine) gates.forEach((o, k) => {
    const gp = gpos(k);
    if (Math.hypot(P.x - gp.x, P.z - gp.z) < 1.8 && time > portalT) {
      if (k === 3) { portalT = time + 3; toast('Fase 4 · Em breve 🚧', 2000); }
      else if (k > 0 && savedIn(k) < 7) { portalT = time + 3; toast(`Fase ${k + 1} 🔒 ${savedIn(k)}/7 amigos`, 2000); }
      else { portalT = time + 5; enterLevel(k + 1); }
    }
  });
  coinsL.forEach(k => { // moedas
    if (k.got) return;
    k.t += dt; k.g.rotation.y = k.t * 3; k.g.position.y = k.y + Math.sin(k.t * 2) * .12;
    if (Math.hypot(P.x - k.x, P.z - k.z) < 1.2 && Math.abs(P.y + .9 - k.y) < 1.5) { k.got = true; k.g.visible = false; coins++; store.set('pd_coins', coins); updHud(); }
  });
  hubPads.forEach((p, i) => {
    p.e.scale.setScalar(1 + Math.sin(time * 3 + i) * .12);
    const on = inHub && !lv.on && !cine && P.ground && P.y < .6 && Math.hypot(P.x - p.x, P.z - p.z) < 1.3;
    if (on && !p.on && canControl) p.fn(); p.on = on;
  });
  hubAnim.forEach(f => f(time));
  if (arrow.visible && SAVED.size > 0) arrow.visible = false;
  skyK += (skyT - skyK) * (1 - Math.exp(-1.6 * dt));
  if (skyT > 0 || skyK > .002) { scene.background.copy(SKYc).lerp(DUSK, skyK); scene.fog.color.copy(scene.background); }
  else if (skyK !== 0) { skyK = 0; scene.background.copy(SKYc); scene.fog.color.copy(SKYc); }
  R.render(scene, cam);
}
function resize() { R.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', resize); resize(); updHud(); shopRefresh();
if (store.get('pd_tutdone', false)) { enterHub(); say(8, 'Bem-vindo de volta! 🌀'); arrow.visible = false; setTimeout(() => { if (step === 8) tut.style.opacity = 0; }, 3500); }
frame();
</script>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const TOT = { fr: 30, tro: 3, stk: 15, boss: 3, skin: 38 };
  const ls = { get(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } } };

  // saves antigos (pd_*) viram o Save 1
  try {
    const old = Object.keys(localStorage).filter(k => k.startsWith('pd_'));
    const has1 = Object.keys(localStorage).some(k => k.startsWith('pdS1_'));
    if (old.length && !has1) old.forEach(k => { localStorage.setItem('pdS1_' + k.slice(3), localStorage.getItem(k)); localStorage.removeItem(k); });
  } catch (e) { }

  const stats = n => {
    const g = (k, d) => ls.get('pdS' + n + '_' + k, d), keys = (() => { try { return Object.keys(localStorage).some(k => k.startsWith('pdS' + n + '_')); } catch (e) { return false; } })();
    return { used: keys, coins: g('coins', 0), fr: g('saved10', []).length, tro: g('tro3', []).length, stk: g('stk', []).length, boss: g('boss', []).length, skin: g('own', []).length };
  };
  const STAMPS = [['📄', 'Amigos', 'fr', '#d9453b'], ['🏆', 'Troféus', 'tro', '#3b6fd9'], ['✨', 'Figurinhas', 'stk', '#8a4fd0'], ['👑', 'Chefes', 'boss', '#2e9a5a'], ['👕', 'Skins', 'skin', '#e08a1e']];
  const ROT = [-8, 6, -4, 9, -6];
  let started = false;

  function renderSlots() {
    const row = $('slrow'); row.innerHTML = '';
    [1, 2, 3].forEach(n => {
      const s = stats(n), done = s.used && STAMPS.every(x => s[x[2]] >= TOT[x[2]]);
      const c = document.createElement('div'); c.className = 'card';
      if (done) {
        c.innerHTML = '<div class="pages"></div><div class="book"><div class="bt">PAPER<br>DOLL</div><div class="fin" style="--r:-8deg">FINAL</div><div class="bn">Save ' + n + ' · 🪙 ' + s.coins + '</div></div>';
      } else {
        let h = '<div class="sheet"><div class="sn">Save ' + n + '</div>';
        if (!s.used) h += '<div class="empty"><b>✏️</b>Folha em branco<br>Toque para começar</div>';
        else if (!(STAMPS.some(x => s[x[2]] > 0) || s.coins > 0)) h += '<div class="empty"><b>🌱</b>Tutorial concluído<br>Toque para continuar</div>';
        else {
          h += '<div class="sm">Tudo que você já fez:</div><div class="stamps">';
          STAMPS.forEach((x, i) => { const v = s[x[2]]; if (v > 0) h += '<div class="stp' + (v >= TOT[x[2]] ? ' full' : '') + '" style="--c:' + x[3] + ';--r:' + ROT[i] + 'deg;--d:' + (i * .12) + 's">' + x[0] + ' ' + x[1] + '<b>' + v + '/' + TOT[x[2]] + (v >= TOT[x[2]] ? ' ✔' : '') + '</b></div>'; });
          h += '</div><div class="coinl">🪙 ' + s.coins + '</div>';
        }
        c.innerHTML = h + '</div>';
      }
      if (s.used) {
        const d = document.createElement('button'); d.className = 'del'; d.textContent = '🗑 apagar'; let arm = 0;
        d.onclick = e => {
          e.stopPropagation();
          if (!arm) { arm = 1; d.textContent = '⚠ de novo'; setTimeout(() => { arm = 0; d.textContent = '🗑 apagar'; }, 2500); return; }
          try { Object.keys(localStorage).filter(k => k.startsWith('pdS' + n + '_')).forEach(k => localStorage.removeItem(k)); } catch (e2) { }
          renderSlots();
        };
        c.appendChild(d);
      }
      c.onclick = () => choose(n, c, done);
      row.appendChild(c);
    });
  }

  function choose(n, card, done) {
    if (started) return; started = true;
    window.PD_SLOT = n;
    const go = () => {
      const sc = document.createElement('script'); sc.textContent = $('gamecode').textContent; document.body.appendChild(sc);
      $('slots').classList.add('off'); setTimeout(() => $('slots').remove(), 700);
    };
    if (done) { card.classList.add('opening'); setTimeout(go, 750); } else go();
  }

  function showSlots() { $('boot').classList.add('off'); setTimeout(() => $('boot').remove(), 600); renderSlots(); $('slots').classList.add('on'); }

  // ===== carregamento =====
  const bar = $('bbar').firstElementChild, txt = $('btxt');
  const skip = (() => { try { const v = sessionStorage.getItem('pd_skip'); sessionStorage.removeItem('pd_skip'); return !!v; } catch (e) { return false; } })();
  const frases = ['Dobrando os papéis…', 'Apontando os lápis…', 'Cortando os bonequinhos…', 'Passando cola…', 'Arrumando a vila…'];
  let prog = 0, loaded = false, t0 = performance.now(), fi = 0;
  const fz = setInterval(() => { txt.textContent = frases[++fi % frases.length]; }, 1100);
  const tick = setInterval(() => {
    prog = loaded ? 100 : Math.min(90, prog + (90 - prog) * .06 + .4);
    bar.style.width = prog + '%';
    if (loaded && performance.now() - t0 > (skip ? 300 : 1400)) { clearInterval(tick); clearInterval(fz); txt.textContent = 'Pronto! ✨'; setTimeout(showSlots, 250); }
  }, 80);
  function loadThree() {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    sc.onload = () => { loaded = true; };
    sc.onerror = () => { clearInterval(tick); clearInterval(fz); txt.textContent = 'Sem conexão 😢 Toque para tentar de novo'; $('boot').onclick = () => location.reload(); };
    document.head.appendChild(sc);
  }
  loadThree();
})();
</script>
</body>
